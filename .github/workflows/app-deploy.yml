name: Deploy app

# Builds the Vue app and publishes dist/ to gh-pages, PRESERVING the data/
# subtree that the data.yml workflow maintains (the publish script excludes
# data/ on app deploys). Shares the gh-pages-publish concurrency group with
# data.yml so the two force-pushes can never interleave.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.12.0

      - name: Yarn install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Publish to gh-pages (preserving data/)
        run: bash scripts/publish_gh_pages.sh dist ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
