name: Build

on:
  pull_request:
    branches:
      main

# Narrower than read-all: this job only ever reads the checkout. It runs on
# fork PRs (pull_request, NOT pull_request_target) with persist-credentials
# false, so no secret is reachable from PR-supplied code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.12.0

      - name: Yarn install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
